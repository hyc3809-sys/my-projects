<title>성공파트너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 열 모바일 원장(ledger). 상단 고정 탭, 숫자는 고정폭, 상승 빨강·하락 파랑(국내 시세 관례) */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5c6777;
  --line: #dce0e6;
  --chip: #eceff3;
  --accent: #1f5f57;
  --accent-ink: #ffffff;
  --up: #cf302b;
  --down: #1c5ed0;
  --high: #b3401c;
  --warn: #9a6400;
  --info: #5c6777;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --surface: #19202a; --ink: #e7ebf0; --muted: #9aa5b3; --line: #29313c; --chip: #222a35;
    --accent: #5fb3a6; --accent-ink: #0c1513; --up: #ff6a64; --down: #6ea1ff; --high: #f2825c; --warn: #e2a83c; --info: #9aa5b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #19202a; --ink: #e7ebf0; --muted: #9aa5b3; --line: #29313c; --chip: #222a35;
  --accent: #5fb3a6; --accent-ink: #0c1513; --up: #ff6a64; --down: #6ea1ff; --high: #f2825c; --warn: #e2a83c; --info: #9aa5b3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.muted { color: var(--muted); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }

header.top { padding-top: 20px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
header.top h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.asof { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 12px; font-weight: 500; }
.pill.warn { color: var(--warn); }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px; margin-inline: -4px;
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--line);
}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: 0 0 auto; border: 0; background: transparent; color: var(--muted);
  font: 500 14px var(--font-body); padding: 8px 12px; border-radius: 8px; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { padding: 10px 14px; border-radius: var(--radius); background: var(--chip); font-size: 14px; }
section.panel { display: flex; flex-direction: column; gap: 20px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.block > h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .label { font-size: 12px; color: var(--muted); }
.tile .value { font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.tile .sub { font-size: 12px; }
@media (max-width: 460px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .tiles .tile:first-child { grid-column: 1 / -1; }
}

.market { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mkt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mkt .name { font-size: 12px; color: var(--muted); font-weight: 500; }
.mkt .close { font-size: 18px; }
.mkt .meta { font-size: 12px; color: var(--muted); }

.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.alert.high { border-left-color: var(--high); }
.alert.mid { border-left-color: var(--warn); }
.alert .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.alert.high .tag { color: var(--high); } .alert.mid .tag { color: var(--warn); } .alert.info .tag { color: var(--info); }

.commentary { font-size: 15px; }
.commentary h4 { font-size: 15px; margin-top: 14px; margin-bottom: 4px; }
.commentary h4:first-child { margin-top: 0; }
.commentary p { margin: 4px 0; }
.commentary ul { margin: 2px 0 6px; padding-left: 18px; }
.commentary li { margin: 2px 0; }
.commentary li.sub { margin-left: 16px; list-style: circle; }

.positions { display: flex; flex-direction: column; gap: 8px; }
.pos { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.pos .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pos .title { min-width: 0; }
.pos .title strong { font-size: 16px; }
.pos .title .code { font-size: 12px; color: var(--muted); margin-left: 6px; }
.pos .ret { font-size: 18px; font-weight: 500; white-space: nowrap; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; font-size: 13px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv span:first-child { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.flow { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.flow b { font-weight: 500; }
.small { font-size: 12px; }

.rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.row .l { min-width: 0; }
.row .r { text-align: right; white-space: nowrap; }

.news { display: flex; flex-direction: column; gap: 14px; }
.news h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.news ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.news a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.news a:hover { border-bottom-color: var(--accent); }
.news .src { font-size: 12px; color: var(--muted); margin-left: 4px; }

form.editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
form.editor .full { grid-column: 1 / -1; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.field input { font: 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
label.field input.num { font-family: var(--font-num); }
.hint { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button.primary, button.ghost, button.danger { font: 500 14px var(--font-body); border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.danger { background: transparent; color: var(--high); border-color: var(--high); }
button.small { padding: 5px 10px; font-size: 13px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.holding { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.holding:first-child { border-top: 0; }
.holding .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.empty { padding: 20px 16px; text-align: left; color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 6px; }
.empty strong { color: var(--ink); }
.foot { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20; }
.report-list button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--ink); font: inherit; cursor: pointer; padding: 0; display: flex; justify-content: space-between; gap: 12px; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">국내 주식 포트폴리오</div>
    <h1>성공파트너</h1>
    <div class="asof" id="asof"><span class="pill">불러오는 중</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="화면 선택">
    <button role="tab" id="tab-status" data-tab="status" aria-selected="true">현황</button>
    <button role="tab" id="tab-holdings" data-tab="holdings" aria-selected="false">보유 종목</button>
    <button role="tab" id="tab-watch" data-tab="watch" aria-selected="false">관심 종목</button>
    <button role="tab" id="tab-rules" data-tab="rules" aria-selected="false">투자 원칙</button>
    <button role="tab" id="tab-history" data-tab="history" aria-selected="false">지난 리포트</button>
  </nav>

  <div class="banner" id="banner" hidden></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";
  var state = {
    tab: "status", holdings: [], watch: [], rules: null, reports: [],
    selected: null, editing: null, editingWatch: null, confirmDel: null,
    db: null, dbMissing: false, readonly: false, loaded: {}, confirmed: false
  };
  try { var t = localStorage.getItem("sp-tab"); if (t) state.tab = t; } catch (e) {}

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function n(v) { return typeof v === "number" && isFinite(v) ? v : null; }
  function won(v) { v = n(v); return v == null ? "–" : Math.round(v).toLocaleString("ko-KR") + "원"; }
  function num(v, d) { v = n(v); return v == null ? "–" : v.toLocaleString("ko-KR", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(v, signed) { v = n(v); if (v == null) return "–"; return (signed !== false && v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
  function sgnWon(v) { v = n(v); if (v == null) return "–"; return (v > 0 ? "+" : "") + Math.round(v).toLocaleString("ko-KR") + "원"; }
  function cls(v) { v = n(v); return v == null || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
  function parseNum(s) { if (s == null) return null; s = String(s).replace(/[,\s원%]/g, ""); if (s === "") return null; var x = Number(s); return isFinite(x) ? x : NaN; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function shortDate(d) { if (!d) return ""; var p = d.split("-"); return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : d; }

  var toastTimer;
  function toast(msg) {
    var el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function banner(msg) { var b = $("#banner"); if (msg) { b.textContent = msg; b.hidden = false; } else { b.hidden = true; } }

  function currentReport() {
    if (state.selected) { for (var i = 0; i < state.reports.length; i++) if (state.reports[i].id === state.selected) return state.reports[i]; }
    return state.reports[0] || null;
  }
  function closeMap() {
    var r = state.reports[0], m = {};
    if (r && r.positions) r.positions.forEach(function (p) { if (n(p.close) != null) m[p.code] = { close: p.close, date: p.date }; });
    if (r && r.watch) r.watch.forEach(function (p) { if (n(p.close) != null) m[p.code] = { close: p.close, date: p.date }; });
    return m;
  }

  // 한국 시간 기준 오늘 리포트가 없는지 (평일 08:10 이후)
  function kstNow() { var d = new Date(Date.now() + 9 * 3600 * 1000); return { date: d.toISOString().slice(0, 10), day: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
  function missingToday() {
    var k = kstNow(), latest = state.reports[0];
    if (!state.loaded.reports || state.dbMissing || k.day === 0 || k.day === 6 || k.min < 8 * 60 + 10) return false;
    return !latest || latest.date < k.date;
  }
  // 리포트 작성 이후 보유 종목(코드·수량·평단가)이 바뀌었는지
  function holdingsChanged(r) {
    if (!state.loaded.holdings) return false;
    var a = {}, b = {};
    (r.positions || []).forEach(function (p) { a[p.code] = Number(p.qty) + "/" + Number(p.avg_price); });
    state.holdings.forEach(function (x) { b[x.code] = Number(x.qty) + "/" + Number(x.avg_price); });
    var ka = Object.keys(a);
    if (ka.length !== Object.keys(b).length) return true;
    return ka.some(function (k) { return a[k] !== b[k]; });
  }

  // ---------- 해설 문구(간단한 마크다운) ----------
  function md(src) {
    var lines = esc(src || "").split("\n"), out = "", inList = false;
    function close() { if (inList) { out += "</ul>"; inList = false; } }
    lines.forEach(function (raw) {
      var line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      if (/^#{1,4}\s+/.test(raw)) { close(); out += "<h4>" + line.replace(/^#{1,4}\s+/, "") + "</h4>"; }
      else if (/^\s*[-•·]\s+/.test(raw)) {
        if (!inList) { out += "<ul>"; inList = true; }
        out += "<li" + (/^\s{2,}/.test(raw) ? ' class="sub"' : "") + ">" + line.replace(/^\s*[-•·]\s+/, "") + "</li>";
      }
      else if (!raw.trim()) { close(); }
      else { close(); out += "<p>" + line + "</p>"; }
    });
    close(); return out;
  }

  // ---------- 지표·수급 표시 ----------
  function eokFmt(v) { v = n(v); if (v == null) return "–"; var s = v > 0 ? "+" : v < 0 ? "−" : "", a = Math.abs(v); return s + (a >= 10000 ? (a / 10000).toFixed(2) + "조" : Math.round(a).toLocaleString("ko-KR") + "억"); }
  function times(v) { v = n(v); return v == null ? "–" : v.toFixed(2) + "배"; }
  function streakTxt(f) { var s = n(f.foreign_streak); if (s == null || Math.abs(s) < 2) return ""; return " · 외국인 " + Math.abs(s) + "일 연속 " + (s > 0 ? "순매수" : "순매도"); }
  function valFlow(p) {
    var v = p.valuation, f = p.flow, out = "";
    if (v && v.type === "stock") {
      out += '<div class="kv">' +
        '<div><span>PER (추정)</span><span class="num">' + (v.loss_making ? "적자" : times(v.per)) + (n(v.fwd_per) != null ? ' <span class="muted">(' + v.fwd_per.toFixed(1) + ')</span>' : '') + '</span></div>' +
        '<div><span>PBR</span><span class="num">' + times(v.pbr) + '</span></div>' +
        '<div><span>배당수익률</span><span class="num">' + (n(v.div_yield_pct) != null ? v.div_yield_pct.toFixed(2) + "%" : "–") + '</span></div></div>';
    }
    if (f) {
      out += '<div class="flow num">외국인 5일 <b class="' + cls(f.foreign_5d_eok) + '">' + eokFmt(f.foreign_5d_eok) + '</b> · 기관 5일 <b class="' + cls(f.institution_5d_eok) + '">' + eokFmt(f.institution_5d_eok) + '</b>' + esc(streakTxt(f)) +
        (n(f.foreign_hold_pct) != null ? '<br>외국인 보유 ' + f.foreign_hold_pct.toFixed(2) + '%' + (n(f.foreign_hold_chg_5d_pp) != null ? ' (5일 ' + (f.foreign_hold_chg_5d_pp > 0 ? '+' : '') + f.foreign_hold_chg_5d_pp.toFixed(2) + '%p)' : '') : '') +
        '<br><span class="small">수급 금액은 일별 순매수 수량×종가로 추정</span></div>';
    }
    if (v && n(v.consensus_target) != null) out += '<div class="muted small">증권사 평균 목표가 ' + num(v.consensus_target) + '원 (' + esc(shortDate(v.consensus_date)) + ' 집계, 종가 대비 ' + pct(v.consensus_gap_pct) + ')</div>';
    return out;
  }
  function watchExtra(w) {
    var v = w.valuation, f = w.flow, s = [];
    if (v && v.type === "stock") { s.push(v.loss_making ? "적자" : "PER " + (n(v.per) != null ? v.per.toFixed(1) : "–")); s.push("PBR " + (n(v.pbr) != null ? v.pbr.toFixed(2) : "–")); }
    if (f) s.push("외국인 5일 " + eokFmt(f.foreign_5d_eok));
    return s.length ? "<br>" + esc(s.join(" · ")) : "";
  }
  function mflow(r, k) {
    var f = (r.market_flow || {})[k]; if (!f || n(f.foreign_eok) == null) return "";
    var note = f.matches_as_of ? "" : ' <span class="muted">(' + esc(shortDate(f.date)) + ' 기준)</span>';
    return '<span class="meta num">외국인 ' + eokFmt(f.foreign_eok) + '<br>기관 ' + eokFmt(f.institution_eok) + '<br>개인 ' + eokFmt(f.individual_eok) + note + '</span>';
  }

  // ---------- 화면: 현황 ----------
  function renderStatus() {
    var r = currentReport();
    if (!r) {
      var none = state.loaded.reports ? "" : " (불러오는 중)";
      return '<section class="panel"><div class="empty"><strong>아직 리포트가 없습니다' + none + '</strong>' +
        '<span>평일 오전 8시 전에 그날의 리포트가 여기에 올라옵니다.</span>' +
        '<span>먼저 <b>보유 종목</b> 탭에서 종목을 넣고, <b>투자 원칙</b> 탭에서 현금과 기준을 정해 두세요.</span></div></section>';
    }
    var t = r.totals || {}, rk = r.risk || {}, h = "";
    if (state.selected && state.reports[0] && state.selected !== state.reports[0].id) {
      h += '<div class="banner">' + esc(r.date) + ' 리포트를 보고 있습니다. <button class="ghost small" data-act="latest">최신 리포트로</button></div>';
    }
    if (r === state.reports[0] && holdingsChanged(r)) h += '<div class="banner">보유 종목이 이 리포트 작성 이후 바뀌었습니다. 다음 리포트에 반영됩니다.</div>';

      '<label class="field"><span>평단가 (원)</span><input id="h-avg" class="num" inputmode="decimal" placeholder="70,000" value="' + esc(e.avg_price != null ? e.avg_price.toLocaleString("ko-KR") : "") + '"' + dis + '></label>' +

  function renderHoldings() {
    var cm = closeMap(), h = '<section class="panel"><div class="block"><h2>' + (state.editing ? "종목 수정" : "종목 추가") + '</h2>' + holdingForm() + '</div>';

    h += '<div class="block"><h2>보유 종목 ' + list.length + '개</h2>';
    if (!list.length) {
      h += '<div class="empty"><strong>보유 종목 없음 (전량 현금)</strong><span>매수하면 위 칸에 종목코드, 수량, 평단가를 넣고 <b>종목 추가</b>를 누르세요. 종목코드는 증권사 앱이나 네이버 증권에서 확인할 수 있습니다.</span></div>';
    } else {
      var total = 0;
      h += '<div class="rows">' + list.map(function (x) {
        var cost = x.qty * x.avg_price; total += cost;

        var confirm = state.confirmDel === "h:" + x.code;
        return '<div class="holding"><div class="head"><div class="title"><b>' + esc(x.name || x.code) + '</b> <span class="muted num">' + esc(x.code) + '</span></div><div>' + val + '</div></div>' +
          '<div class="kv"><div><span>수량</span><span class="num">' + num(x.qty) + '주</span></div><div><span>평단가</span><span class="num">' + num(x.avg_price) + '</span></div><div><span>매입금액</span><span class="num">' + won(cost) + '</span></div></div>' +
          (x.memo ? '<div class="muted" style="font-size:13px">' + esc(x.memo) + '</div>' : '') +
          '<div class="actions">' + (confirm
            ? '<span style="font-size:13px;align-self:center">삭제할까요?</span><button class="danger small" data-act="del-hold" data-code="' + esc(x.code) + '">삭제</button><button class="ghost small" data-act="cancel-del">취소</button>'

          '</div></div>';
      }).join("") + '<div class="row"><span class="l muted">매입금액 합계</span><span class="r num">' + won(total) + '</span></div></div>';
    }
    return h + '</div></section>';
  }

  function render() {
    document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false"); });
    var r = currentReport(), a = $("#asof");
    var stale = missingToday() ? '<span class="pill warn">오늘 리포트 아직 없음</span>' : '';
    if (r) a.innerHTML = '<span class="pill num">' + esc(shortDate(r.as_of)) + ' 종가 기준</span>' + stale + '<span>' + esc(String(r.generated_at || "").replace("T", " ").slice(0, 16)) + ' 작성 · 평일 오전 8시 전 자동 갱신</span>';
    else a.innerHTML = '<span class="pill">' + (state.loaded.reports ? "리포트 대기" : "불러오는 중") + '</span>' + stale + '<span>평일 오전 8시 전 자동 작성</span>';
    var html = { status: renderStatus, holdings: renderHoldings, watch: renderWatch, rules: renderRules, history: renderHistory }[state.tab] || renderStatus;

  function typing() { var a = document.activeElement; return !!(a && a.closest && a.closest("#main form") && a.tagName === "INPUT"); }
  function softRender() { if (typing()) { pending = true; return; } pending = false; render(); }
  document.addEventListener("focusout", function () { setTimeout(function () { if (pending && !typing()) { pending = false; render(); } }, 0); });

  // ---------- 저장 ----------
  function writeErr(e) {
    var code = e && e.code;
    if (code === "invalid_argument") { state.readonly = true; banner("이 계정으로는 저장할 수 없습니다. 페이지 소유자 계정으로 열어 주세요."); render(); }
    else if (code === "quota_exceeded") toast("저장 공간이 가득 찼습니다. 오래된 리포트를 지워야 합니다.");
    else toast("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
  }
  function now() { return new Date().toISOString(); }

  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!state.db) return;
    var id = ev.target.id;
    if (id === "f-hold") {
      var code = $("#h-code").value.trim().toUpperCase(), name = $("#h-name").value.trim(),
        qty = parseNum($("#h-qty").value), avg = parseNum($("#h-avg").value), memo = $("#h-memo").value.trim();
      if (!/^[0-9A-Z]{6}$/.test(code)) return toast("종목코드는 6자리로 넣어 주세요. 예: 005930");
      if (!(qty > 0)) return toast("수량은 0보다 큰 숫자로 넣어 주세요.");
      if (!(avg > 0)) return toast("평단가는 0보다 큰 숫자로 넣어 주세요.");
      var prev = state.editing && state.editing.code;
      state.db.collection("holdings").doc(code).set({ code: code, name: name || code, qty: qty, avg_price: avg, memo: memo, updated_at: now() })
        .then(function () {
          var after = prev && prev !== code ? state.db.collection("holdings").doc(prev).delete() : null;
          return after;
        })
        .then(function () { state.editing = null; toast(prev ? "변경했습니다" : "추가했습니다"); render(); })
        .catch(writeErr);
    } else if (id === "f-watch") {
      var wc = $("#w-code").value.trim().toUpperCase(), wn = $("#w-name").value.trim(), wm = $("#w-memo").value.trim();
      if (!/^[0-9A-Z]{6}$/.test(wc)) return toast("종목코드는 6자리로 넣어 주세요. 예: 035420");
      state.db.collection("watchlist").doc(wc).set({ code: wc, name: wn || wc, memo: wm, updated_at: now() })
        .then(function () { toast("관심 종목에 추가했습니다"); render(); }).catch(writeErr);
    } else if (id === "f-rules") {
      var vals = { cash: parseNum($("#r-cash").value), max_weight_pct: parseNum($("#r-maxw").value), min_cash_pct: parseNum($("#r-mincash").value),
        stop_loss_pct: parseNum($("#r-stop").value), take_profit_pct: parseNum($("#r-take").value) };
      for (var k in vals) { if (Number.isNaN(vals[k])) return toast("숫자만 넣어 주세요."); if (vals[k] != null && vals[k] < 0) return toast("0 이상의 숫자로 넣어 주세요."); }
      if (vals.stop_loss_pct != null) vals.stop_loss_pct = Math.abs(vals.stop_loss_pct);
      vals.updated_at = now();
      state.db.doc("config/rules").set(vals).then(function () { toast("투자 원칙을 저장했습니다"); }).catch(writeErr);
    }
  });

  document.addEventListener("click", function (ev) {
    var tb = ev.target.closest("nav.tabs button");
    if (tb) { state.tab = tb.dataset.tab; state.confirmDel = null; try { localStorage.setItem("sp-tab", state.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act, code = b.dataset.code;
    if (act === "edit-hold") { state.editing = state.holdings.filter(function (x) { return x.code === code; })[0] || null; render(); window.scrollTo(0, 0); }
    else if (act === "cancel-edit") { state.editing = null; render(); }
    else if (act === "ask-del") { state.confirmDel = b.dataset.key; render(); }
    else if (act === "cancel-del") { state.confirmDel = null; render(); }
    else if (act === "del-hold" && state.db) { state.db.collection("holdings").doc(code).delete().then(function () { state.confirmDel = null; toast("삭제했습니다"); render(); }).catch(writeErr); }
    else if (act === "del-watch" && state.db) { state.db.collection("watchlist").doc(code).delete().then(function () { state.confirmDel = null; toast("삭제했습니다"); render(); }).catch(writeErr); }
    else if (act === "open-report") { state.selected = b.dataset.id; state.tab = "status"; render(); window.scrollTo(0, 0); }
    else if (act === "latest") { state.selected = null; render(); }
  });

  // ---------- 데이터 연결 ----------
  render();
  (async function () {
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { state.dbMissing = true; state.loaded.reports = true; banner("저장소에 연결할 수 없습니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요."); render(); return; }
    state.db = db;
    var timer = setTimeout(function () { if (!state.confirmed) banner("데이터를 아직 불러오지 못했습니다. 연결을 확인하는 중입니다. 보이는 내용은 최신이 아닐 수 있습니다."); }, 10000);
    function mark(k, meta) { state.loaded[k] = true; if (meta && !meta.fromCache && !state.confirmed) { state.confirmed = true; clearTimeout(timer); banner(null); } }
    function onErr(e) { clearTimeout(timer); if (e && e.code === "revoked") banner("이 페이지의 데이터 접근 권한이 바뀌었습니다."); else banner("데이터를 불러오지 못했습니다. 페이지를 다시 열어 주세요."); }
    function rows(snap) { return snap.docs.map(function (d) { var o = d.data() || {}; var c = {}; for (var k in o) c[k] = o[k]; c.id = d.id; return c; }); }
    db.collection("holdings").onSnapshot(function (s) { state.holdings = rows(s); mark("holdings", s.metadata); softRender(); }, onErr);
    db.collection("watchlist").onSnapshot(function (s) { state.watch = rows(s); mark("watch", s.metadata); softRender(); }, onErr);
    db.doc("config/rules").onSnapshot(function (d) { state.rules = d.exists ? d.data() : {}; mark("rules", d.metadata); softRender(); }, onErr);
    db.collection("reports").orderBy("date", "desc").limit(30).onSnapshot(function (s) { state.reports = rows(s); mark("reports", s.metadata); softRender(); }, onErr);
  })();
})();
</script>
